			<p>Have a question or want to talk about a project? You can reach me through the details below.</p>
			<ul class="contact-list">
				<li><i class="fas fa-envelope"></i> sulaimany597@gmail.com</li>

			<!-- Contact Form updated with Web3Forms backend endpoint and access key -->
			<form class="contact-form" id="contactForm" action="https://api.web3forms.com/submit" method="POST">
				<!-- Replace YOUR_ACCESS_KEY with the access key sent to sulaimany597@gmail.com -->
				<input type="hidden" name="access_key" value="e2c22511-ca83-43eb-82ed-5f264dcf4bfa">

				<div class="form-field">
					<label for="name">Name</label>
					<input type="text" id="name" name="name" autocomplete="name" required>
				</div>
				<div class="form-field">
					<label for="email">Email</label>
					<input type="email" id="email" name="email" autocomplete="email" required>
				</div>
				<div class="form-field">
					<label for="subject">Subject</label>
					<input type="text" id="subject" name="subject" required>
				</div>
				<div class="form-field">
					<label for="message">Message</label>
					<textarea id="message" name="message" required></textarea>
				</div>
				<button type="submit" class="btn-primary">
					<i class="fas fa-paper-plane"></i> Send message
				</button>
				<p class="form-status" id="formStatus" aria-live="polite"></p>
